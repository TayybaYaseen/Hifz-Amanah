# Subflow (F05): a Teacher records one Sabqi portion (Para 1, Complete, Completed, no mistakes) for a student today.
# Usage: runFlow { file: ../../support/maestro/daily-sabqi.yaml, env: { STUDENT: EXT-A-001, SESSION: Fajr,
#        SESSION_FIRST_EMPTY: "true" } }
# SESSION is typed only when the Session label field is shown (MULTI_SESSION mode). With SESSION_FIRST_EMPTY the
# first save is tried without a label and must be refused (F05-AC7). Starts on Home; ends on the saved record.
appId: com.hifzamanah.app
---
- tapOn:
    id: "nav.dailyEntry"
- extendedWaitUntil:
    visible:
      id: "daily.class.Hifz A1"
    timeout: 30000
- tapOn:
    id: "daily.class.Hifz A1"
- tapOn:
    id: "daily.student.${STUDENT}"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "daily.attendance.PRESENT"
    direction: DOWN
    speed: 10
- tapOn:
    id: "daily.attendance.PRESENT"
- runFlow:
    file: daily-revision-portion.yaml
    env: { SECTION: sabqi, N: "1", PARA: "1", UNIT: COMPLETE, STATUS: COMPLETED, COMPLETED: "" }
- runFlow:
    when:
      true: ${SESSION_FIRST_EMPTY == 'true'}
    commands:
      - runFlow: dismiss-dev-warning.yaml
      - scrollUntilVisible:
          element:
            id: "daily.save"
          direction: DOWN
          speed: 10
          visibilityPercentage: 50
      - tapOn:
          id: "daily.save"
      - scrollUntilVisible:
          element:
            id: "daily.session.error"
          direction: UP
          speed: 10
- runFlow:
    when:
      true: ${typeof SESSION !== 'undefined' && SESSION !== ''}
    commands:
      - scrollUntilVisible:
          element:
            id: "daily.session"
          direction: UP
          speed: 10
      - tapOn:
          id: "daily.session"
      - inputText: ${SESSION}
      - pressKey: Enter
- waitForAnimationToEnd
- runFlow: dismiss-dev-warning.yaml
- scrollUntilVisible:
    element:
      id: "daily.save"
    direction: DOWN
    speed: 10
    visibilityPercentage: 50
- tapOn:
    id: "daily.save"
- extendedWaitUntil:
    visible:
      id: "record.screen"
    timeout: 30000
