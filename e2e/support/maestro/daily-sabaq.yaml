# Subflow (F05): add a Sabaq portion on Daily Entry. With the SYNTHETIC Quran fixture (2 Ayat per line for Surahs 1–3),
# Surah 2 Ayat 1–20 is 10 lines from the layout; ASSIGNED keeps the pre-fill when empty.
# Usage: runFlow { file: ../../support/maestro/daily-sabaq.yaml, env: { SURAH: "2", FROM: "1", TO: "20", STATUS: PARTIAL, COMPLETED: "6" } }
appId: com.hifzamanah.app
---
- runFlow:
    file: tap.yaml
    env: { ID: "daily.sabaq.add" }
- runFlow:
    when: { notVisible: { id: "daily.sabaq.portion.1.title" } }
    commands:
      - tapOn: { id: "daily.sabaq.add" }
      - waitForAnimationToEnd
- runFlow: { file: type.yaml, env: { ID: "daily.sabaq.portion.1.surah", TEXT: "${SURAH}" } }
- runFlow: { file: type.yaml, env: { ID: "daily.sabaq.portion.1.ayahStart", TEXT: "${FROM}" } }
- runFlow: { file: type.yaml, env: { ID: "daily.sabaq.portion.1.ayahEnd", TEXT: "${TO}" } }
- runFlow: { file: tap.yaml, env: { ID: "daily.sabaq.portion.1.status.${STATUS}" } }
- runFlow:
    when:
      true: ${typeof COMPLETED !== 'undefined' && COMPLETED !== ''}
    commands:
      - runFlow: { file: type.yaml, env: { ID: "daily.sabaq.portion.1.completed", TEXT: "${COMPLETED}" } }
- runFlow: { file: tap.yaml, env: { ID: "daily.sabaq.portion.1.mistakes.none" } }
