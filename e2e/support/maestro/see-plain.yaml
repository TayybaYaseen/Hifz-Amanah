# Subflow: like see.yaml (scroll until an element is visible, then optionally match its text), but without centring.
# For assertions on long forms where see.yaml's centring scroll cannot settle once save errors have expanded the cards
# (seen on Daily Entry): the element is found and checked where it is. Never use it before a tap.
# Usage: runFlow { file: ../../support/maestro/see-plain.yaml, env: { ID: "daily.sabqi.portion.1.para.error", TEXT: ".*1 to 30.*" } }
appId: com.hifzamanah.app
---
- waitForAnimationToEnd
# A save's validation messages can take a few seconds to render on a slow emulator; give the element up to 10 s to
# appear where it is (this wait ends as soon as it does) before deciding to scroll, so the search does not start
# too early and scroll away from it. The assertions below still require it.
- extendedWaitUntil:
    visible: { id: "${ID}" }
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible: { id: "${ID}" }
    commands:
      - scrollUntilVisible: { element: { id: "${ID}" }, direction: DOWN, timeout: 30000, optional: true }
- runFlow:
    when:
      notVisible: { id: "${ID}" }
    commands:
      # Up to 120 s: on a slow emulator each scroll step takes seconds, and a long form with expanded errors is several
      # screens tall (30 s stopped one field short). The search ends as soon as the element is on screen.
      - scrollUntilVisible: { element: { id: "${ID}" }, direction: UP, timeout: 120000 }
- assertVisible: { id: "${ID}" }
- runFlow:
    when:
      true: ${typeof TEXT !== 'undefined' && TEXT !== ''}
    commands:
      - assertVisible: { id: "${ID}", text: "${TEXT}" }
