# Subflow (F05): an Owner/Admin sets the daily-report mode in workspace settings.
# Usage: runFlow { file: ../../support/maestro/set-report-mode.yaml, env: { MODE: SINGLE | MULTI_SESSION } }
# Starts on Home; ends on the workspace screen showing the result (saved, or the conflict list).
appId: com.hifzamanah.app
---
- tapOn:
    id: "nav.more"
- tapOn:
    id: "more.workspace"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "workspace.reportMode.${MODE}"
    direction: DOWN
    speed: 10
- tapOn:
    id: "workspace.reportMode.${MODE}"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "workspace.reportMode.save"
    direction: DOWN
    speed: 10
- tapOn:
    id: "workspace.reportMode.save"
- extendedWaitUntil:
    visible:
      id: "workspace.reportMode.saved|workspace.reportMode.conflicts|workspace.reportMode.error"
    timeout: 15000
