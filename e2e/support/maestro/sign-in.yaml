# Subflow: sign in as a seeded persona.
# Usage:
#   - runFlow:
#       file: ../../support/maestro/sign-in.yaml
#       env: { USER_ID: teacher-a1 }
# For Owner/Admin personas use sign-in-staff.yaml, which completes two-factor sign-in.
# Selectors use the testID contract in e2e/README.md. The User ID field may be prefilled with the last User ID,
# so it is cleared first.
appId: com.hifzamanah.app
---
- tapOn:
    id: "signin.userId"
- eraseText: 64
- inputText: ${USER_ID}
- tapOn:
    id: "signin.password"
- inputText: ${PASSWORD || 'E2e-Test-Pass-1'}
- hideKeyboard
- tapOn:
    id: "signin.submit"
# A Teacher's first sign-in on a device offers the optional app lock (NFR-OFF-011); flows skip it.
- extendedWaitUntil:
    visible:
      id: "appLock.setup.screen|home.screen"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "appLock.setup.skip"
    commands:
      - tapOn:
          id: "appLock.setup.skip"
- assertVisible:
    id: "home.screen"
