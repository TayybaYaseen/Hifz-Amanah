# Subflow: sign in as a seeded persona.
# Usage:
#   - runFlow:
#       file: ../../support/maestro/sign-in.yaml
#       env: { USER_ID: teacher-a1 }
# For Owner/Admin personas use sign-in-staff.yaml, which completes two-factor sign-in.
# Selectors use the testID contract in e2e/README.md. The User ID field may be prefilled with the last User ID,
# so it is cleared first.
appId: com.hifzamanah.app
---
# Type only once each field has focus (focus-type.yaml), and check the User ID arrived whole.
- runFlow: { file: focus-type.yaml, env: { ID: "signin.userId", TEXT: "${USER_ID}" } }
- runFlow: { file: focus-type.yaml, env: { ID: "signin.password", TEXT: "${PASSWORD || 'E2e-Test-Pass-1'}" } }
# Close the keyboard without Back (see dismiss-keyboard.yaml).
- runFlow: dismiss-keyboard.yaml
- assertVisible: { id: "signin.userId", text: "${USER_ID}" }
- tapOn:
    id: "signin.submit"
# A Teacher's first sign-in on a device offers the optional app lock (NFR-OFF-011); flows skip it.
- extendedWaitUntil:
    visible:
      id: "appLock.setup.screen|home.screen"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "appLock.setup.skip"
    commands:
      - tapOn:
          id: "appLock.setup.skip"
- assertVisible:
    id: "home.screen"
