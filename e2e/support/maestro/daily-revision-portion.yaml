# Subflow (F05): add one Sabqi or Manzil portion on Daily Entry and fill it.
# Usage: runFlow { file: ../../support/maestro/daily-revision-portion.yaml,
#        env: { SECTION: sabqi | manzil, N: 2, PARA: "4", UNIT: COMPLETE, STATUS: PARTIAL, COMPLETED: HALF } }
# UNIT is a Para preset (RUBU, HALF, SALASAH, COMPLETE). COMPLETED is a Para preset or empty (not recorded).
# PARA empty keeps the default (Sabqi defaults to the Sabaq Para, F05-AC12). "No mistakes" is chosen.
appId: com.hifzamanah.app
---
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "daily.${SECTION}.add"
    direction: DOWN
    centerElement: true
    timeout: 60000
    optional: true
- scrollUntilVisible:
    element:
      id: "daily.${SECTION}.add"
    direction: UP
    timeout: 60000
    centerElement: true
# The new card takes the button's place on screen. A tap lost during a re-render (seen offline) is retried once;
# the retry runs only when the card did not appear, so it never adds a second portion.
- waitForAnimationToEnd
- tapOn:
    id: "daily.${SECTION}.add"
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "daily.${SECTION}.portion.${N}.title"
    commands:
      - scrollUntilVisible:
          element:
            id: "daily.${SECTION}.add"
          direction: DOWN
          centerElement: true
          timeout: 60000
          optional: true
      - scrollUntilVisible:
          element:
            id: "daily.${SECTION}.add"
          direction: UP
          timeout: 60000
          centerElement: true
      - waitForAnimationToEnd
      - tapOn:
          id: "daily.${SECTION}.add"
      - waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "daily.${SECTION}.portion.${N}.para"
    direction: DOWN
    centerElement: true
    timeout: 60000
    optional: true
- scrollUntilVisible:
    element:
      id: "daily.${SECTION}.portion.${N}.para"
    direction: UP
    timeout: 60000
    centerElement: true
- runFlow:
    when:
      true: ${typeof PARA !== 'undefined' && PARA !== ''}
    commands:
      - tapOn:
          id: "daily.${SECTION}.portion.${N}.para"
      - eraseText: 2
      - inputText: ${PARA}
      - pressKey: Enter
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "daily.${SECTION}.portion.${N}.unit.${UNIT}"
    direction: DOWN
    centerElement: true
    timeout: 60000
    optional: true
- scrollUntilVisible:
    element:
      id: "daily.${SECTION}.portion.${N}.unit.${UNIT}"
    direction: UP
    timeout: 60000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "daily.${SECTION}.portion.${N}.unit.${UNIT}"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "daily.${SECTION}.portion.${N}.status.${STATUS}"
    direction: DOWN
    centerElement: true
    timeout: 60000
    optional: true
- scrollUntilVisible:
    element:
      id: "daily.${SECTION}.portion.${N}.status.${STATUS}"
    direction: UP
    timeout: 60000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "daily.${SECTION}.portion.${N}.status.${STATUS}"
- runFlow:
    when:
      true: ${typeof COMPLETED !== 'undefined' && COMPLETED !== ''}
    commands:
      - scrollUntilVisible:
          element:
            id: "daily.${SECTION}.portion.${N}.completed.${COMPLETED}"
          direction: UP
          centerElement: true
          timeout: 60000
          optional: true
      - scrollUntilVisible:
          element:
            id: "daily.${SECTION}.portion.${N}.completed.${COMPLETED}"
          direction: DOWN
          timeout: 60000
          centerElement: true
      - waitForAnimationToEnd
      - tapOn:
          id: "daily.${SECTION}.portion.${N}.completed.${COMPLETED}"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "daily.${SECTION}.portion.${N}.mistakes.none"
    direction: DOWN
    centerElement: true
    timeout: 60000
    optional: true
- scrollUntilVisible:
    element:
      id: "daily.${SECTION}.portion.${N}.mistakes.none"
    direction: UP
    timeout: 60000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "daily.${SECTION}.portion.${N}.mistakes.none"
