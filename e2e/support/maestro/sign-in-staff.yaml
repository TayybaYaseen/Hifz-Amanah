# Subflow: sign in as a seeded Owner/Admin persona, completing two-factor sign-in (FR-AUTH-016).
# Usage:
#   - runFlow:
#       file: ../../support/maestro/sign-in-staff.yaml
#       env: { USER_ID: admin-a }
# The User ID field may be prefilled with the last User ID, so it is cleared first.
appId: com.hifzamanah.app
---
- tapOn:
    id: "signin.userId"
- eraseText: 64
- inputText: ${USER_ID}
- tapOn:
    id: "signin.password"
- inputText: ${PASSWORD || 'E2e-Test-Pass-1'}
- hideKeyboard
- tapOn:
    id: "signin.submit"
- assertVisible:
    id: "twoFactor.screen"
- runScript:
    file: control.js
    env:
      ACTION: totp
      LOGIN_ID: ${USER_ID}
- tapOn:
    id: "twoFactor.code"
- inputText: ${output.totp}
- hideKeyboard
- tapOn:
    id: "twoFactor.submit"
# Owner/Admin must set an app-lock PIN on a new device (NFR-OFF-011): enter and confirm a synthetic test PIN, and
# skip the fingerprint offer if the emulator has one. Already set up → straight to Home.
- extendedWaitUntil:
    visible:
      id: "appLock.setup.screen|home.screen"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "appLock.setup.pin"
    commands:
      - inputText: "246810"
      - extendedWaitUntil:
          visible:
            id: "appLock.setup.pin"
          timeout: 5000
      - inputText: "246810"
- runFlow:
    when:
      visible:
        id: "appLock.biometric.skip"
    commands:
      - tapOn:
          id: "appLock.biometric.skip"
- extendedWaitUntil:
    visible:
      id: "home.screen"
    timeout: 30000
