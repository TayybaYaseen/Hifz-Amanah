# Subflow: switch the interface language.
# env: LOCALE = en | ur | ur-Latn
# The picker shows its options inline (apps/mobile LanguagePicker); a collapsed picker is opened first if present.
appId: com.hifzamanah.app
---
- runFlow:
    when:
      visible:
        id: "language.picker"
    commands:
      - tapOn:
          id: "language.picker"
- scrollUntilVisible:
    element:
      id: "language.option.${LOCALE}"
- tapOn:
    id: "language.option.${LOCALE}"
