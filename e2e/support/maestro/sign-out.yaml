# Subflow: sign out from any screen, accepting the unsynced-changes warning if shown.
appId: com.hifzamanah.app
---
- tapOn:
    id: "nav.more"
# Sign out is the last button on More, at the bottom of the screen, where a development build's warning toast can
# cover it and swallow the tap; close the toast first (a no-op in release builds).
- waitForAnimationToEnd
- runFlow: dismiss-dev-warning.yaml
- runFlow:
    file: tap.yaml
    env: { ID: "settings.signOut" }
# Sign-out first checks the device for unsynced work and then ends the session on the server, which can take several
# seconds on a slow emulator: wait for whichever comes first, the unsynced-changes warning or the sign-in screen.
- extendedWaitUntil:
    visible:
      id: "signin.screen|signout.unsyncedWarning"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "signout.unsyncedWarning"
    commands:
      - tapOn:
          id: "signout.signOutAnyway"
- extendedWaitUntil:
    visible:
      id: "signin.screen"
    timeout: 30000
