# Subflow: sign out from any screen, accepting the unsynced-changes warning if shown.
appId: com.hifzamanah.app
---
- tapOn:
    id: "nav.more"
- tapOn:
    id: "settings.signOut"
- runFlow:
    when:
      visible:
        id: "signout.unsyncedWarning"
    commands:
      - tapOn:
          id: "signout.signOutAnyway"
- assertVisible:
    id: "signin.screen"
