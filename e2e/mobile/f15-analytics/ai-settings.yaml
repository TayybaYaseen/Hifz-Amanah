# F15 · Analytics and AI recommendations — mobile E2E (docs/specs/15-f15-analytics-ai.md; design.md §13 US-064…065)
# Covers: F15-AC9, F15-AC10, F15-AC11, F15-AC12, F15-AC14
# The API runs with the AI provider stub (test-stub; the launch provider is Deferred, SRS §17 DEC-B45).
# SYNTHETIC DATA ONLY: control.js analyticsSeed — S1 last week (six recorded days), so the AI button is offered.
appId: com.hifzamanah.app # Android application ID (SRS §17 DEC-B55, decided 2026-11-08)
name: F15 AI settings — provider, on/off, limits, data categories; no AI for Student or Parent
tags:
  - F15
  - US-063
  - US-064
  - US-065
---
- runFlow: ../../support/maestro/reset.yaml
- runScript: { file: ../../support/maestro/control.js, env: { ACTION: quranSeed } }
- runScript: { file: ../../support/maestro/control.js, env: { ACTION: analyticsSeed } }
# 1. admin-a → Settings → AI: turn AI on, choose the provider, limit 1, attendance sharing off; names, contact details
#    and notes shown as never shared; save.                                                            (F15-AC10, F15-AC14)
- runFlow:
    file: ../../support/maestro/sign-in-staff.yaml
    env: { USER_ID: admin-a }
- runFlow:
    file: ../../support/maestro/tap.yaml
    env: { ID: "nav.more" }
- runFlow:
    file: ../../support/maestro/tap.yaml
    env: { ID: "more.aiSettings" }
- extendedWaitUntil:
    visible: { id: "aiSettings.enabled" }
    timeout: 30000
# The switch is disabled until a provider is chosen (AI cannot be on without one): choose it first.
- extendedWaitUntil:
    notVisible: { id: "aiSettings.loading" }
    timeout: 30000
- runFlow:
    file: ../../support/maestro/tap.yaml
    env: { ID: "aiSettings.provider.test-stub" }
# Tap until the switch reports the wanted state (a tap during the first load can be overwritten by it).
- extendedWaitUntil:
    notVisible: { id: "aiSettings.loading" }
    timeout: 30000
- repeat:
    while:
      notVisible: { id: "aiSettings.enabled", checked: true }
    times: 3
    commands:
      - runFlow:
          file: ../../support/maestro/tap.yaml
          env: { ID: "aiSettings.enabled" }
- assertVisible: { id: "aiSettings.enabled", checked: true }
- repeat:
    while:
      notVisible: { id: "aiSettings.category.attendance", checked: false }
    times: 3
    commands:
      - runFlow:
          file: ../../support/maestro/tap.yaml
          env: { ID: "aiSettings.category.attendance" }
- assertVisible: { id: "aiSettings.category.attendance", checked: false }
- runFlow:
    file: ../../support/maestro/see.yaml
    env: { ID: "aiSettings.neverShared" }
- assertVisible: { text: "Never shared: names, contact details, notes" }
# 2. A limit of 0 → field error; nothing is saved.
- runFlow:
    file: ../../support/maestro/type.yaml
    env: { ID: "aiSettings.limit.monthly", TEXT: "0" }
- runFlow:
    file: ../../support/maestro/tap.yaml
    env: { ID: "aiSettings.save" }
- runFlow:
    file: ../../support/maestro/see.yaml
    env: { ID: "aiSettings.error.positive", TEXT: ".*Limits must be positive numbers.*" }
- runScript: { file: ../../support/maestro/control.js, env: { ACTION: auditCount, AUDIT_ACTION: AI_SETTINGS_UPDATED } }
- assertTrue: ${output.auditCount === 0}
# Limit 1 → saved and audited.
- runFlow:
    file: ../../support/maestro/type.yaml
    env: { ID: "aiSettings.limit.monthly", TEXT: "1" }
- runFlow:
    file: ../../support/maestro/tap.yaml
    env: { ID: "aiSettings.save" }
# The notice is at the top of the form; Save is at the bottom, so scroll back up to it.
- runFlow:
    file: ../../support/maestro/see.yaml
    env: { ID: "aiSettings.saved", TEXT: "AI settings saved." }
- runScript: { file: ../../support/maestro/control.js, env: { ACTION: auditCount, AUDIT_ACTION: AI_SETTINGS_UPDATED } }
- assertTrue: ${output.auditCount === 1}
- runFlow: ../../support/maestro/back-home.yaml
- runFlow: ../../support/maestro/sign-out.yaml
# 3. teacher-a1 → one recommendation; the second → "AI limit reached for this period", with no second provider call.
#    The payload sent left attendance out.                                                             (F15-AC12, F15-AC14)
- runFlow:
    file: ../../support/maestro/sign-in.yaml
    env: { USER_ID: teacher-a1 }
- runFlow:
    file: ../../support/maestro/analytics-open.yaml
    env: { STUDENT: EXT-A-001, PREV: "1" }
- runFlow:
    file: ../../support/maestro/tap.yaml
    env: { ID: "analytics.ai.button" }
- extendedWaitUntil:
    visible: { id: "analytics.ai.range" }
    timeout: 60000
- runScript: { file: ../../support/maestro/control.js, env: { ACTION: aiStubInfo } }
- assertTrue: ${output.ai.calls === 1 && output.ai.hasAttendance === false}
- runFlow:
    file: ../../support/maestro/tap.yaml
    env: { ID: "analytics.ai.button" }
- extendedWaitUntil:
    visible: { id: "analytics.ai.limit" }
    timeout: 60000
- runFlow:
    file: ../../support/maestro/see.yaml
    env: { ID: "analytics.ai.limit", TEXT: ".*AI limit reached for this period.*" }
- runScript: { file: ../../support/maestro/control.js, env: { ACTION: aiStubInfo } }
- assertTrue: ${output.ai.calls === 1}
# The calculated analytics stay on screen.
- runFlow:
    file: ../../support/maestro/see.yaml
    env: { ID: "analytics.quality.average" }
- runFlow: ../../support/maestro/back-home.yaml
- runFlow: ../../support/maestro/sign-out.yaml
# 4. admin-a turns AI off; teacher-a1's Analytics shows no AI button.                                 (F15-AC11)
- runFlow:
    file: ../../support/maestro/sign-in-staff.yaml
    env: { USER_ID: admin-a }
- runFlow:
    file: ../../support/maestro/tap.yaml
    env: { ID: "nav.more" }
- runFlow:
    file: ../../support/maestro/tap.yaml
    env: { ID: "more.aiSettings" }
- extendedWaitUntil:
    visible: { id: "aiSettings.enabled" }
    timeout: 30000
# Tap until the switch reports the wanted state (a tap during the first load can be overwritten by it).
- extendedWaitUntil:
    notVisible: { id: "aiSettings.loading" }
    timeout: 30000
- repeat:
    while:
      notVisible: { id: "aiSettings.enabled", checked: false }
    times: 3
    commands:
      - runFlow:
          file: ../../support/maestro/tap.yaml
          env: { ID: "aiSettings.enabled" }
- assertVisible: { id: "aiSettings.enabled", checked: false }
- runFlow:
    file: ../../support/maestro/tap.yaml
    env: { ID: "aiSettings.save" }
# The notice is at the top of the form; Save is at the bottom, so scroll back up to it.
- runFlow:
    file: ../../support/maestro/see.yaml
    env: { ID: "aiSettings.saved", TEXT: "AI settings saved." }
- runScript: { file: ../../support/maestro/control.js, env: { ACTION: auditCount, AUDIT_ACTION: AI_SETTINGS_UPDATED } }
- assertTrue: ${output.auditCount === 2}
- runFlow: ../../support/maestro/back-home.yaml
- runFlow: ../../support/maestro/sign-out.yaml
- runFlow:
    file: ../../support/maestro/sign-in.yaml
    env: { USER_ID: teacher-a1 }
- runFlow:
    file: ../../support/maestro/analytics-open.yaml
    env: { STUDENT: EXT-A-001, PREV: "1" }
- runFlow:
    file: ../../support/maestro/see.yaml
    env: { ID: "analytics.quality.average" }
- assertNotVisible: { id: "analytics.ai.button" }
- assertNotVisible: { id: "analytics.ai.panel" }
- runFlow: ../../support/maestro/back-home.yaml
- runFlow: ../../support/maestro/sign-out.yaml
# 5. student-s1 and parent-p1: no Analytics and no AI anywhere.                                        (F15-AC9)
- runFlow:
    file: ../../support/maestro/sign-in.yaml
    env: { USER_ID: student-s1 }
- runFlow:
    file: ../../support/maestro/tap.yaml
    env: { ID: "nav.more" }
- assertNotVisible: { id: "more.analytics" }
- assertNotVisible: { id: "more.aiSettings" }
- assertNotVisible: { id: "analytics.ai.button" }
- runFlow: ../../support/maestro/sign-out.yaml
- runFlow:
    file: ../../support/maestro/sign-in.yaml
    env: { USER_ID: parent-p1 }
- runFlow:
    file: ../../support/maestro/tap.yaml
    env: { ID: "nav.more" }
- assertNotVisible: { id: "more.analytics" }
- assertNotVisible: { id: "more.aiSettings" }
- assertNotVisible: { id: "analytics.ai.button" }
- runFlow: ../../support/maestro/sign-out.yaml
