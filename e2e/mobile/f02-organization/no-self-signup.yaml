# F02 · Organization and roles — mobile E2E (docs/specs/03-f02-organization-roles.md; decision review 2026-10-30, SRS §17)
# Covers: F02-AC16
appId: com.hifzamanah.app # Android application ID (SRS §17 DEC-B55, decided 2026-11-08)
name: F02 no self sign-up or in-app workspace creation
tags:
  - F02
  - US-007
---
- launchApp:
    clearState: true
# 1. Given the app and the public API, when a person who has no account looks for a way to create a workspace, then there is no sign-up or create-workspace action or endpoint. A workspace and its first Owner exist only after the platform operator creates them. (F02-AC16)
- assertVisible: { id: "signin.screen" }
- assertVisible: "Accounts are created by your madrasa Admin."
- assertNotVisible: "Sign up"
- assertNotVisible: "Create account"
- assertNotVisible: "Register"
- assertNotVisible: "Create madrasa"
- assertNotVisible: "Create workspace"
# The only other way out of sign-in is password recovery, which also offers no sign-up.
- tapOn: { id: "signin.forgot" }
- assertNotVisible: "Sign up"
- assertNotVisible: "Create workspace"
