# 1. Given confirmed homework due on a day the student is Absent or on Leave, or that becomes a holiday, when the next class day comes, then the same homework is shown as outstanding and labelled "carried over — absent/holiday". It is not counted as failed, and the confirmed assignment is unchanged. (F08-AC19)
# 2. Given no internet connection, when the Teacher confirms a draft, then it shows "Confirmed on device — waiting to sync", and after sync it becomes Confirmed with the Teacher and the original confirmation time. (F08-AC20)
