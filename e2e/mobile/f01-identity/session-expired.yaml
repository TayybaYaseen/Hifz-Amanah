# F01 · Identity — mobile E2E (docs/specs/01-f01-identity-authentication.md; design.md §4.13, §8)
# Covers: F01-AC6, F01-AC5
# SYNTHETIC DATA ONLY: seeded personas. The server clock is moved forward with test control; the device keeps its own.
# The unsynced change is real: a Daily Entry saved offline stays in the outbox while the server clock passes the
# refresh-token lifetime (31 days, DEC-B65), so the first server call after reconnecting meets the ended session.
appId: com.hifzamanah.app # Android application ID (SRS §17 DEC-B55, decided 2026-11-08)
name: F01 session — expired session prompts sign-in and keeps unsynced changes
tags:
  - F01
  - US-001
---
- runFlow: ../../support/maestro/reset.yaml
- runFlow: ../../support/maestro/ensure-class-day.yaml
# 1. Sign in as teacher-a1.
- runFlow:
    file: ../../support/maestro/sign-in.yaml
    env: { USER_ID: teacher-a1 }
# 2. Offline: save a Daily Entry for S1 → saved on the device, its changes waiting to sync. Daily Entry is opened once
#    online first, so the class roster is on the device.
- tapOn: { id: "nav.dailyEntry" }
- extendedWaitUntil:
    visible: { id: "daily.class.Hifz A1" }
    timeout: 30000
- tapOn: { id: "daily.class.Hifz A1" }
- extendedWaitUntil:
    visible: { id: "daily.student.EXT-A-001" }
    timeout: 30000
- runFlow: ../../support/maestro/back-home.yaml
- runFlow: ../../support/maestro/go-offline.yaml
- runFlow:
    file: ../../support/maestro/daily-start.yaml
    env: { STUDENT: EXT-A-001 }
- runFlow:
    file: ../../support/maestro/daily-revision-portion.yaml
    env: { SECTION: sabqi, N: "1", PARA: "1", UNIT: COMPLETE, STATUS: COMPLETED, COMPLETED: "" }
- runFlow: ../../support/maestro/dismiss-dev-warning.yaml
- runFlow: { file: ../../support/maestro/tap.yaml, env: { ID: "daily.save" } }
- extendedWaitUntil:
    visible: { id: "sync.savedOnDevice" }
    timeout: 30000
- runFlow: ../../support/maestro/back-home.yaml
- extendedWaitUntil:
    visible: { id: "sync.banner.state.OFFLINE" }
    timeout: 30000
- assertVisible: { id: "sync.banner.count", text: ".*: [1-9][0-9]*" }
# The entry is several operations (record, attendance, portion, attempt, ...); the prompt must keep the same count.
- copyTextFrom: { id: "sync.banner.count" }
- evalScript: ${output.pending = maestro.copiedText.replace(/[^0-9]/g, '')}
- tapOn: { id: "sync.banner" }
- extendedWaitUntil:
    visible: { id: "syncQueue.screen" }
    timeout: 30000
- runFlow: { file: ../../support/maestro/see.yaml, env: { ID: "syncQueue.section.PENDING" } }
- assertNotVisible: { id: "syncQueue.section.SYNCED" }
- runFlow: ../../support/maestro/back-home.yaml
# 3. The session ends while the change is still on the device: 31 days pass on the server clock (DEC-B65), so the
#    access token and the refresh token are both refused.
- runScript:
    file: ../../support/maestro/control.js
    env: { ACTION: clock, ADVANCE_MS: "2678400000" }
# 4. Back online, the next server call (the sync) shows the session-expired prompt with the User ID kept, and the
#    unsynced changes are kept: the prompt still counts them all as waiting to sync.                      (F01-AC6)
- setAirplaneMode: disabled
- extendedWaitUntil:
    visible: { id: "sessionExpired.screen" }
    timeout: 90000
- assertVisible: { id: "signin.userId", text: "teacher-a1" }
- assertVisible: { id: "sessionExpired.pending", text: "Changes waiting to sync: ${output.pending}\\. They are kept and will sync after you sign in\\." }
- assertNotVisible: { id: "home.screen" }
# 5. Sign in again → the kept change syncs.                                                        (F01-AC6)
- tapOn: { id: "signin.password" }
- inputText: "E2e-Test-Pass-1"
- runFlow: ../../support/maestro/dismiss-keyboard.yaml
- tapOn: { id: "signin.submit" }
- extendedWaitUntil:
    visible: { id: "home.screen" }
    timeout: 30000
- extendedWaitUntil:
    visible: { id: "sync.banner.state.SYNCED" }
    timeout: 90000
- tapOn: { id: "sync.banner" }
- extendedWaitUntil:
    visible: { id: "syncQueue.screen" }
    timeout: 30000
- runFlow: { file: ../../support/maestro/see.yaml, env: { ID: "syncQueue.section.SYNCED" } }
- assertNotVisible: { id: "syncQueue.section.PENDING" }
- assertNotVisible: { id: "syncQueue.section.FAILED" }
- runFlow: ../../support/maestro/back-home.yaml
# 6. Sign out; Back keeps the sign-in screen and opens no data screen.                         (F01-AC5)
- runFlow: ../../support/maestro/sign-out.yaml
- back
- assertNotVisible: { id: "home.screen" }
- assertNotVisible: { id: "profile.screen" }
