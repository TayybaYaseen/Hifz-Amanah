# F01 · Identity — mobile E2E (docs/specs/01-f01-identity-authentication.md; design.md §4.2)
# Covers: F01-AC7, F01-AC8, F01-AC9, F01-AC10
appId: ${APP_ID} # DEFERRED: Android application ID (SRS §17 DEC-B55)
name: F01 password reset — User ID, OTP, new password
tags:
  - F01
  - US-002
---
- runFlow: ../../support/maestro/reset.yaml
# 1. Forgot password → an unknown User ID → the neutral confirmation.                          (F01-AC8)
- tapOn: { id: "signin.forgot" }
- tapOn: { id: "reset.userId" }
- inputText: "no-such-user"
- hideKeyboard
- tapOn: { id: "reset.send" }
- assertVisible: { id: "reset.sent" }
- copyTextFrom: { id: "reset.sent" }
- evalScript: ${output.neutral = maestro.copiedText}
- tapOn: { id: "reset.back" }
# 2. Forgot password → teacher-a1 → the same neutral confirmation; the OTP field shows its expiry. (F01-AC7)
- tapOn: { id: "signin.forgot" }
- tapOn: { id: "reset.userId" }
- eraseText: 40
- inputText: "teacher-a1"
- hideKeyboard
- tapOn: { id: "reset.send" }
- assertVisible: { id: "reset.sent", text: "${output.neutral}" }
- assertVisible: { id: "reset.otp" }
- assertVisible: { text: ".*10.*" }
# 3. A wrong OTP → an error; the password is unchanged.                                        (F01-AC9)
- runScript:
    file: ../../support/maestro/control.js
    env: { ACTION: otp, LOGIN_ID: teacher-a1 }
- tapOn: { id: "reset.otp" }
- inputText: "000000"
- tapOn: { id: "reset.newPassword" }
- inputText: "Fresh-Pass-2026"
- hideKeyboard
- tapOn: { id: "reset.submit" }
- assertVisible: { id: "reset.error" }
# 4. The OTP from the test mail sink and a new valid password.                                 (F01-AC10)
- tapOn: { id: "reset.otp" }
- inputText: ${output.otp}
- tapOn: { id: "reset.newPassword" }
- eraseText: 40
- inputText: "Fresh-Pass-2026"
- hideKeyboard
- tapOn: { id: "reset.submit" }
- assertVisible: { id: "signin.screen" }
# 5. The old password fails; the new one reaches Teacher Home.
- tapOn: { id: "signin.userId" }
- eraseText: 40
- inputText: "teacher-a1"
- tapOn: { id: "signin.password" }
- inputText: "E2e-Test-Pass-1"
- hideKeyboard
- tapOn: { id: "signin.submit" }
- assertVisible: { id: "signin.error" }
- tapOn: { id: "signin.userId" }
- eraseText: 40
- runFlow:
    file: ../../support/maestro/sign-in.yaml
    env: { USER_ID: teacher-a1, PASSWORD: Fresh-Pass-2026 }
- assertVisible: { id: "home.role.TEACHER" }
