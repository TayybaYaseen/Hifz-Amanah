# F01 · Identity — mobile E2E (docs/specs/01-f01-identity-authentication.md; design.md §13 US-003…005)
# Covers: F01-AC12, F01-AC13, F01-AC14, F01-AC16, F01-AC18
# User IDs use hyphens (teacher-new): FR-AUTH-013 allows no dots.
# Android's Back first closes the keyboard, so `hideKeyboard` comes before every navigating `back`.
appId: ${APP_ID} # DEFERRED: Android application ID (SRS §17 DEC-B55)
name: F01 accounts — Admin creates Teacher, Student, Parent with shared email
tags:
  - F01
  - US-003
  - US-004
  - US-005
---
- runFlow: ../../support/maestro/reset.yaml
# 1. Sign in as admin-a → More → Accounts → Add.
- runFlow:
    file: ../../support/maestro/sign-in-staff.yaml
    env: { USER_ID: admin-a }
- tapOn: { id: "nav.more" }
- tapOn: { id: "more.accounts" }
- tapOn: { id: "accounts.add" }
# 2. Create a Teacher with User ID teacher-new → saved and listed.                              (F01-AC12)
- tapOn: { id: "accountCreate.role.TEACHER" }
- tapOn: { id: "accountCreate.userId" }
- eraseText: 40
- inputText: "teacher-new"
- tapOn: { id: "accountCreate.name" }
- inputText: "New Teacher"
- tapOn: { id: "accountCreate.password" }
- inputText: "Fresh-Pass-2026"
- hideKeyboard
- tapOn: { id: "accountCreate.submit" }
- scrollUntilVisible:
    element: { id: "accounts.item.teacher-new" }
# 3. Another account with User ID teacher-a1 → "User ID already in use" on the User ID field.  (F01-AC14)
- scrollUntilVisible:
    element: { id: "accounts.add" }
    direction: UP
- tapOn: { id: "accounts.add" }
- tapOn: { id: "accountCreate.userId" }
- eraseText: 40
- inputText: "teacher-a1"
- tapOn: { id: "accountCreate.name" }
- inputText: "Duplicate"
- tapOn: { id: "accountCreate.password" }
- inputText: "Fresh-Pass-2026"
- hideKeyboard
- tapOn: { id: "accountCreate.submit" }
- assertVisible: { id: "accountCreate.userId.error" }
# 4. A password that breaks the policy → field error; nothing saved.                           (F01-AC16)
- tapOn: { id: "accountCreate.userId" }
- eraseText: 40
- inputText: "teacher-short"
- tapOn: { id: "accountCreate.password" }
- eraseText: 40
- inputText: "Abc-123"
- hideKeyboard
- tapOn: { id: "accountCreate.submit" }
- assertVisible: { id: "accountCreate.password.error" }
- hideKeyboard
- back
- assertVisible: { id: "accounts.screen" }
- assertNotVisible: { id: "accounts.item.teacher-short" }
# 5. Student student-new and Parent parent-new with the same email → both saved.               (F01-AC18)
- tapOn: { id: "accounts.add" }
- tapOn: { id: "accountCreate.role.STUDENT" }
- tapOn: { id: "accountCreate.userId" }
- eraseText: 40
- inputText: "student-new"
- tapOn: { id: "accountCreate.name" }
- inputText: "New Student"
- tapOn: { id: "accountCreate.email" }
- inputText: "family.new@example.test"
- tapOn: { id: "accountCreate.password" }
- inputText: "Fresh-Pass-2026"
- hideKeyboard
- tapOn: { id: "accountCreate.submit" }
- scrollUntilVisible:
    element: { id: "accounts.item.student-new" }
- scrollUntilVisible:
    element: { id: "accounts.add" }
    direction: UP
- tapOn: { id: "accounts.add" }
- tapOn: { id: "accountCreate.role.PARENT" }
- tapOn: { id: "accountCreate.userId" }
- eraseText: 40
- inputText: "parent-new"
- tapOn: { id: "accountCreate.name" }
- inputText: "New Parent"
- tapOn: { id: "accountCreate.email" }
- inputText: "family.new@example.test"
- tapOn: { id: "accountCreate.password" }
- inputText: "Fresh-Pass-2026"
- hideKeyboard
- tapOn: { id: "accountCreate.submit" }
- scrollUntilVisible:
    element: { id: "accounts.item.parent-new" }
# 6. Sign out; sign in as teacher-a1 → More has no Accounts entry.                             (F01-AC13)
- back            # Accounts → More
- back            # More → Home
- runFlow: ../../support/maestro/sign-out.yaml
- runFlow:
    file: ../../support/maestro/sign-in.yaml
    env: { USER_ID: teacher-a1 }
- tapOn: { id: "nav.more" }
- assertVisible: { id: "more.profile" }
- assertNotVisible: { id: "more.accounts" }
