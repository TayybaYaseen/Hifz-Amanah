# 1. Sign in as teacher.a1; go offline; save an entry; admin.a removes teacher.a1 (API); go online.
# 2. "Access revoked": syncing stops, cached data is locked, the pending item stays visible.          (F12-AC14)
# 3. Install the previous app build (E2E_PREVIOUS_APK), sign in, go offline, save 2 entries.
# 4. Test control raises the minimum protocol version; go online → "Upgrade required"; items kept.     (F12-AC15)
# 5. Install the current build over it (local migration runs) → 2 pending items present; they sync.   (F12-AC16)
# 6. teacher.a2 edits S3 (API); teacher.a1 pull → S3 never appears on this device.                    (F12-AC7)
