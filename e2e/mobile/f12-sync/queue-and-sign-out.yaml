# F12 · Offline and synchronization — mobile E2E (docs/specs/04-f12-offline-sync.md; design.md §4.13, §5.9)
# Covers: F12-AC6, F12-AC8, F12-AC10
appId: com.hifzamanah.app # Android application ID (SRS §17 DEC-B55, decided 2026-11-08)
name: F12 sync queue — states, retry, sign-out warning
tags:
  - pending
