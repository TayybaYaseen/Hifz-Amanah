# Precondition: device font scale set to the largest (adb shell settings put system font_scale 2.0).
# 1. Sign in as teacher.a1; visit Teacher Home, Students, Daily Entry, Bulk Entry, Homework, Reports in all three locales.
# 2. No text is clipped or truncated without a way to read it; long synthetic names wrap.              (F11-AC12)
# 3. Every control's bounds are at least 44 dp (read from the view hierarchy).                         (F11-AC12)
# 4. Every status chip, sync state, and attendance mark has a text label and an icon.                  (F11-AC13)
