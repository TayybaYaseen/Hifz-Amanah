# F09 · Weekly and monthly reports — mobile E2E (docs/specs/12-f09-weekly-monthly-reports.md; design.md §4.10)
# Covers: F09-AC1, F09-AC3, F09-AC4, F09-AC5, F09-AC6, F09-AC7, F09-AC14
# SYNTHETIC DATA ONLY: the WEEK scenario of apps/api/src/testing/report-seed.ts, written for S1 last week through the
# real API (lines and Para portions; two attempts on one portion; quality 1, 3 and blanks; one confirmed homework and
# two drafts; Manzil Para 1/5/10 on one day).
appId: com.hifzamanah.app # Android application ID (SRS §17 DEC-B55, decided 2026-11-08)
name: F09 weekly report — range, units, latest attempt, homework, quality, correction
tags:
  - F09
  - US-039
  - US-043
---
- runFlow: ../../support/maestro/reset.yaml
- runScript: { file: ../../support/maestro/control.js, env: { ACTION: quranSeed } }
- runScript: { file: ../../support/maestro/control.js, env: { ACTION: reportSeed, SCENARIO: WEEK } }
- runFlow:
    file: ../../support/maestro/sign-in.yaml
    env: { USER_ID: teacher-a1 }
# 1. Reports → Weekly → S1, previous week: the range Monday–Sunday and "Asia/Karachi" are shown.        (F09-AC1)
- runFlow:
    file: ../../support/maestro/reports-open.yaml
    env: { STUDENT: EXT-A-001, KIND: week, PREV: "1" }
- runFlow:
    file: ../../support/maestro/see.yaml
    env: { ID: "reports.range", TEXT: ".*${output.report.from}.*${output.report.to}.*Asia/Karachi.*" }
# 5. Average quality "2.0 · Good (2 ratings)".                                                         (F09-AC7)
- runFlow:
    file: ../../support/maestro/see.yaml
    env: { ID: "reports.quality", TEXT: ".*2[.]0.*Good.*[(]2 ratings[)].*" }
# 2. Totals: one Lines total and one Para total, never added together.                                 (F09-AC4)
- runFlow:
    file: ../../support/maestro/see.yaml
    env: { ID: "reports.section.SABQI.assigned", TEXT: ".*5/4.*Para.*12.*lines.*" }
# 3. The two-attempt portion shows its latest status; assigned counted once.                          (F09-AC5)
- runFlow:
    file: ../../support/maestro/see.yaml
    env: { ID: "reports.dayRecord.${output.report.tuesday}.portion.1.status.COMPLETED" }
- runFlow:
    file: ../../support/maestro/see.yaml
    env: { ID: "reports.dayRecord.${output.report.tuesday}.portion.1.quality", TEXT: ".*2 attempts.*" }
# 4. Homework: Confirmed 1, Suggestions 2.                                                             (F09-AC6)
- runFlow:
    file: ../../support/maestro/see.yaml
    env: { ID: "reports.homework.confirmed", TEXT: ".*Confirmed: .*1.*" }
- runFlow:
    file: ../../support/maestro/see.yaml
    env: { ID: "reports.homework.drafts", TEXT: ".*Suggestions.*: .*2.*" }
# 6. Daily detail for the Manzil day: three lines with their own status and quantity.                  (F09-AC14)
- runFlow:
    file: ../../support/maestro/see.yaml
    env: { ID: "reports.dayRecord.${output.report.wednesday}.portion.1.status.COMPLETED" }
- runFlow:
    file: ../../support/maestro/see.yaml
    env: { ID: "reports.dayRecord.${output.report.wednesday}.portion.2.status.PARTIAL" }
- runFlow:
    file: ../../support/maestro/see.yaml
    env: { ID: "reports.dayRecord.${output.report.wednesday}.portion.2.amount", TEXT: ".*1/2.*Para.*1.*Para.*" }
- runFlow:
    file: ../../support/maestro/see.yaml
    env: { ID: "reports.dayRecord.${output.report.wednesday}.portion.3.status.NOT_REMEMBERED" }
# 7. Another device corrects Tuesday's rating 3 → 5; reopen the report → the average is updated.       (F09-AC3)
- runScript: { file: ../../support/maestro/control.js, env: { ACTION: reportCorrect } }
- runFlow: ../../support/maestro/back-home.yaml
- runFlow:
    file: ../../support/maestro/reports-open.yaml
    env: { STUDENT: EXT-A-001, KIND: week, PREV: "1" }
- runFlow:
    file: ../../support/maestro/see.yaml
    env: { ID: "reports.quality", TEXT: ".*3[.]0.*Average.*[(]2 ratings[)].*" }
