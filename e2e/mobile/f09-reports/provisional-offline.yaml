# F09 · Weekly and monthly reports — mobile E2E (docs/specs/12-f09-weekly-monthly-reports.md; design.md §4.10 states)
# Covers: F09-AC16, F09-AC15
# SYNTHETIC DATA ONLY: the WEEK scenario of apps/api/src/testing/report-seed.ts (a staff remark on S1's Monday).
appId: com.hifzamanah.app # Android application ID (SRS §17 DEC-B55, decided 2026-11-08)
name: F09 reports — provisional offline label; private notes only for staff
tags:
  - F09
  - US-039
---
- runFlow: ../../support/maestro/reset.yaml
- runFlow: ../../support/maestro/ensure-class-day.yaml
- runScript: { file: ../../support/maestro/control.js, env: { ACTION: quranSeed } }
- runScript: { file: ../../support/maestro/control.js, env: { ACTION: reportSeed, SCENARIO: WEEK } }
- runFlow:
    file: ../../support/maestro/sign-in.yaml
    env: { USER_ID: teacher-a1 }
# 4. Online first: the private remark is visible to teacher-a1, labelled "Private to staff" (this visit also caches the
#    roster and timetable the device needs offline).
- runFlow:
    file: ../../support/maestro/reports-open.yaml
    env: { STUDENT: EXT-A-001, KIND: week, PREV: "1" }
- runFlow:
    file: ../../support/maestro/see.yaml
    env: { ID: "reports.dayRecord.${output.report.from}.portion.1.remarks", TEXT: ".*Private to staff.*" }
- assertNotVisible: { id: "reports.provisional" }
- runFlow: ../../support/maestro/back-home.yaml
# 1. Go offline; save an entry for S1 today (attendance, record, portion, and attempt wait on the device).
- runFlow: ../../support/maestro/go-offline.yaml
- runFlow:
    file: ../../support/maestro/daily-start.yaml
    env: { STUDENT: EXT-A-001 }
- runFlow:
    file: ../../support/maestro/daily-revision-portion.yaml
    env: { SECTION: manzil, N: "1", PARA: "1", UNIT: COMPLETE, STATUS: COMPLETED, COMPLETED: "" }
- runFlow: ../../support/maestro/daily-save.yaml
- runFlow: ../../support/maestro/back-home.yaml
# 2. Reports → Weekly → S1: "Provisional", the last successful sync time, and the pending changes.    (F09-AC16)
- runFlow:
    file: ../../support/maestro/reports-open.yaml
    env: { STUDENT: EXT-A-001, KIND: week, PREV: "" }
- runFlow:
    file: ../../support/maestro/see.yaml
    env: { ID: "reports.provisional", TEXT: ".*Provisional.*Last synced.*Changes waiting to sync: [1-9].*" }
- runFlow:
    file: ../../support/maestro/see.yaml
    env: { ID: "reports.dayRecord.${output.today}" }
# 3. Go online; after sync the label clears (the server's report is shown).
- runFlow: ../../support/maestro/back-home.yaml
- runFlow: ../../support/maestro/go-online.yaml
- extendedWaitUntil:
    visible: { id: "sync.banner.state.SYNCED" }
    timeout: 90000
- runFlow:
    file: ../../support/maestro/reports-open.yaml
    env: { STUDENT: EXT-A-001, KIND: week, PREV: "" }
- assertNotVisible: { id: "reports.provisional" }
- assertNotVisible: { id: "reports.pendingChanges" }
- runFlow: ../../support/maestro/back-home.yaml
# 5. A Parent has no report screen in F09 (published reports are F10), so no private note can reach them.  (F09-AC15)
- runFlow: ../../support/maestro/sign-out.yaml
- runFlow:
    file: ../../support/maestro/sign-in.yaml
    env: { USER_ID: parent-p1 }
- assertNotVisible: { id: "nav.reports" }
