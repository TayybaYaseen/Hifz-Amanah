# 1. Given a student already saved as Absent, when the Teacher changes them to Late, or changes a Present student to Half day, then the record changes, the change is audited, and Hifz portions can be recorded for that student that day. (F04-AC18)
# 2. Given a student who already has recited portions saved for the date, when the Teacher marks them Absent in Bulk Entry, then the row suggests "Mark Late instead". If the Teacher keeps Absent, the row cannot save until an internal note with the reason is entered, and the recited portions are unchanged. (F04-AC19)
# 3. Given attendance or daily records already saved for a date, when the Admin declares a holiday on it, then the Admin is warned with the number of records and must confirm. After confirming, the date is not a working day, those records are excluded from reports and homework suggestions but kept in history, and new entries for that date are refused. (F04-AC20)
# 4. Given Bulk Entry, when the Teacher chooses Leave for a student, then a reason is required on that row, and after saving the row shows "Leave — awaiting approval". (F04-AC21)
