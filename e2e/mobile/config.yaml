# Maestro workspace config for HifzAmanah mobile E2E.
# Run all:        npm run e2e:mobile   (flows target com.hifzamanah.app, SRS §17 DEC-B55)
# Run one spec:   npm run e2e:mobile -- --include-tags F05
# Flows tagged "pending" are written ahead of implementation and are skipped.
# A spec cannot pass its gate while any of its flows is still pending (e2e/README.md).
flows:
  - "*/*"
excludeTags:
  - pending
