# F05 · Daily Hifz entry — mobile E2E (docs/specs/09-f05-daily-hifz-entry.md; design.md §4.7, §5.4)
# Covers: F05-AC1, F05-AC10, F05-AC11, F05-AC12, F05-AC13
# SYNTHETIC DATA ONLY: seeded personas and the synthetic Quran fixture (Surah 2 stands in for the spec's Surah).
appId: com.hifzamanah.app # Android application ID (SRS §17 DEC-B55, decided 2026-11-08)
name: F05 daily entry — Sabaq, two Sabqi, three Manzil with separate outcomes
tags:
  - F05
  - US-018
  - US-020
  - US-021
  - US-022
---
- runFlow: ../../support/maestro/reset.yaml
- runScript:
    file: ../../support/maestro/control.js
    env:
      ACTION: quranSeed
# 1. teacher-a1 → Daily Entry → yesterday, class A1, student S1, Present.                                       (F05-AC1)
- runFlow:
    file: ../../support/maestro/sign-in.yaml
    env: { USER_ID: teacher-a1 }
- tapOn: { id: "nav.dailyEntry" }
- extendedWaitUntil:
    visible: { id: "daily.class.Hifz A1" }
    timeout: 30000
- tapOn: { id: "daily.prevDay" }
- copyTextFrom: { id: "daily.date" }
- evalScript: ${output.reportDate = maestro.copiedText.replace(/[^0-9-]/g, '')}
- tapOn: { id: "daily.class.Hifz A1" }
- tapOn: { id: "daily.student.EXT-A-001" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.attendance.PRESENT" }, direction: DOWN, speed: 10 }
- tapOn: { id: "daily.attendance.PRESENT" }
# 2. Sabaq · Portion 1: Surah 2, Ayat 1–10 → Para derived; Total Lines from the layout; assigned = total;
#    Completed; one Tajweed mistake; quality 2 · Good; remarks.                                                 (F05-AC10)
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.add" }, direction: DOWN, speed: 10 }
- tapOn: { id: "daily.sabaq.add" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.surah" }, direction: DOWN, speed: 10 }
- tapOn: { id: "daily.sabaq.portion.1.surah" }
- inputText: "2"
- tapOn: { id: "daily.sabaq.portion.1.ayahStart" }
- inputText: "1"
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.ayahEnd" }, direction: DOWN, speed: 10 }
- tapOn: { id: "daily.sabaq.portion.1.ayahEnd" }
- inputText: "10"
- pressKey: Enter
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.linesSource.LAYOUT" }, direction: DOWN, speed: 10 }
- assertVisible: { id: "daily.sabaq.portion.1.para" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.status.COMPLETED" }, direction: DOWN, speed: 10 }
- tapOn: { id: "daily.sabaq.portion.1.status.COMPLETED" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.mistakes.add" }, direction: DOWN, speed: 10 }
- tapOn: { id: "daily.sabaq.portion.1.mistakes.add" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.mistake.1.category.TAJWEED" }, direction: DOWN, speed: 10, centerElement: true }
- tapOn: { id: "daily.sabaq.portion.1.mistake.1.category.TAJWEED" }
- tapOn: { id: "daily.sabaq.portion.1.mistake.1.severity.MINOR" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.quality.2" }, direction: DOWN, speed: 10 }
- tapOn: { id: "daily.sabaq.portion.1.quality.2" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.remarks" }, direction: DOWN, speed: 10 }
- tapOn: { id: "daily.sabaq.portion.1.remarks" }
- inputText: "Synthetic remark"
- hideKeyboard
# 3. Sabqi → Add portion: the Para defaults to the Sabaq Para; change it to Para 3, Completed.                  (F05-AC12)
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabqi.add" }, direction: DOWN, speed: 10 }
- tapOn: { id: "daily.sabqi.add" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabqi.portion.1.para" }, direction: DOWN, speed: 10 }
- assertVisible: { id: "daily.sabqi.portion.1.para", text: "[0-9]+" }
- tapOn: { id: "daily.sabqi.portion.1.para" }
- eraseText: 2
- inputText: "3"
- pressKey: Enter
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabqi.portion.1.unit.COMPLETE" }, direction: DOWN, speed: 10 }
- tapOn: { id: "daily.sabqi.portion.1.unit.COMPLETE" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabqi.portion.1.status.COMPLETED" }, direction: DOWN, speed: 10 }
- tapOn: { id: "daily.sabqi.portion.1.status.COMPLETED" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabqi.portion.1.mistakes.none" }, direction: DOWN, speed: 10 }
- tapOn: { id: "daily.sabqi.portion.1.mistakes.none" }
# 4. Sabqi · Portion 2: Para 4, Partial (1/2 of a complete Para).                                               (F05-AC11)
- runFlow:
    file: ../../support/maestro/daily-revision-portion.yaml
    env: { SECTION: sabqi, N: "2", PARA: "4", UNIT: COMPLETE, STATUS: PARTIAL, COMPLETED: HALF }
# 5. Manzil: Para 1 Completed; Para 5 Partial 1/2; Para 10 Not Remembered.                                      (F05-AC13)
- runFlow:
    file: ../../support/maestro/daily-revision-portion.yaml
    env: { SECTION: manzil, N: "1", PARA: "1", UNIT: COMPLETE, STATUS: COMPLETED, COMPLETED: "" }
- runFlow:
    file: ../../support/maestro/daily-revision-portion.yaml
    env: { SECTION: manzil, N: "2", PARA: "5", UNIT: COMPLETE, STATUS: PARTIAL, COMPLETED: HALF }
- runFlow:
    file: ../../support/maestro/daily-revision-portion.yaml
    env: { SECTION: manzil, N: "3", PARA: "10", UNIT: COMPLETE, STATUS: NOT_REMEMBERED, COMPLETED: "" }
# 6. Save → the record keeps yesterday's date and shows six portions, each with its own status (icon + text).
- waitForAnimationToEnd
- runFlow: ../../support/maestro/dismiss-dev-warning.yaml
- scrollUntilVisible: { element: { id: "daily.save" }, direction: DOWN, speed: 10, visibilityPercentage: 50 }
- tapOn: { id: "daily.save" }
- extendedWaitUntil:
    visible: { id: "record.screen" }
    timeout: 30000
- assertVisible: { id: "record.date", text: ".*${output.reportDate}.*" }
- assertVisible: { id: "record.portionCount", text: ".*6.*" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "record.sabaq.portion.1.status.COMPLETED" }, direction: DOWN, speed: 10 }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "record.sabaq.portion.1.quality" }, direction: DOWN, speed: 10 }
- assertVisible: { id: "record.sabaq.portion.1.quality", text: ".*2.*" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "record.sabqi.portion.1.status.COMPLETED" }, direction: DOWN, speed: 10 }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "record.sabqi.portion.2.status.PARTIAL" }, direction: DOWN, speed: 10 }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "record.manzil.portion.1.status.COMPLETED" }, direction: DOWN, speed: 10 }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "record.manzil.portion.2.status.PARTIAL" }, direction: DOWN, speed: 10 }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "record.manzil.portion.3.status.NOT_REMEMBERED" }, direction: DOWN, speed: 10 }
# 7. Edit: Sabqi Para 4 → Completed. Sabqi Para 3 is unchanged.                                                 (F05-AC11)
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "record.edit" }, direction: DOWN, speed: 10 }
- tapOn: { id: "record.edit" }
- extendedWaitUntil:
    visible: { id: "daily.editHelp" }
    timeout: 15000
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabqi.portion.2.status.COMPLETED" }, direction: DOWN, speed: 10 }
- tapOn: { id: "daily.sabqi.portion.2.status.COMPLETED" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabqi.portion.2.completed.clear" }, direction: UP, speed: 10 }
- tapOn: { id: "daily.sabqi.portion.2.completed.clear" }
- waitForAnimationToEnd
- runFlow: ../../support/maestro/dismiss-dev-warning.yaml
- scrollUntilVisible: { element: { id: "daily.save" }, direction: DOWN, speed: 10, visibilityPercentage: 50 }
- tapOn: { id: "daily.save" }
- extendedWaitUntil:
    visible: { id: "record.screen" }
    timeout: 30000
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "record.sabqi.portion.1.status.COMPLETED" }, direction: DOWN, speed: 10 }
- assertVisible: { id: "record.sabqi.portion.1.para", text: ".*3.*" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "record.sabqi.portion.2.status.COMPLETED" }, direction: DOWN, speed: 10 }
- assertVisible: { id: "record.sabqi.portion.2.para", text: ".*4.*" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "record.manzil.portion.2.status.PARTIAL" }, direction: DOWN, speed: 10 }
