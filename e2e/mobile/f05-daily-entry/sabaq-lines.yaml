# F05 · Daily Hifz entry — mobile E2E (docs/specs/09-us-020-record-sabaq.md; design.md §4.7, §5.3)
# Covers: F05-AC20, F05-AC21, F05-AC22
# SYNTHETIC DATA ONLY: the madrasa gets the synthetic Quran fixture (20 Ayat per Surah; a test layout of 2 Ayat per line
# for Surahs 1–3), which matches no real Mushaf. Surah numbers stand in for the Surah names in the spec.
appId: com.hifzamanah.app # Android application ID (SRS §17 DEC-B55, decided 2026-11-08)
name: F05 daily entry — Sabaq by Surah/Ayat range and lines
tags:
  - F05
  - US-020
---
- runFlow: ../../support/maestro/reset.yaml
- runScript:
    file: ../../support/maestro/control.js
    env:
      ACTION: quranSeed
# 1. Sign in as teacher-a1 → Daily Entry → today, class A1, student S1, Present.
- runFlow:
    file: ../../support/maestro/sign-in.yaml
    env: { USER_ID: teacher-a1 }
- tapOn: { id: "nav.dailyEntry" }
- extendedWaitUntil:
    visible: { id: "daily.class.Hifz A1" }
    timeout: 30000
- tapOn: { id: "daily.class.Hifz A1" }
- tapOn: { id: "daily.student.EXT-A-001" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.attendance.PRESENT" }, direction: DOWN, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.attendance.PRESENT" }, direction: UP, timeout: 60000, centerElement: true }
- waitForAnimationToEnd
- tapOn: { id: "daily.attendance.PRESENT" }
# 2. Sabaq · Add portion: no unit picker and no Para presets; the quantity is in lines.                         (F05-AC20)
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.add" }, direction: DOWN, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.sabaq.add" }, direction: UP, timeout: 60000, centerElement: true }
- waitForAnimationToEnd
- tapOn: { id: "daily.sabaq.add" }
- waitForAnimationToEnd
# A tap that only stopped the scroll is retried once, and only when the new card did not appear.
- runFlow:
    when: { notVisible: { id: "daily.sabaq.portion.1.title" } }
    commands:
      - tapOn: { id: "daily.sabaq.add" }
      - waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.unitLabel" }, direction: DOWN, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.unitLabel" }, direction: UP, timeout: 60000, centerElement: true }
- assertNotVisible: { id: "daily.sabaq.portion.1.unit.RUBU" }
- assertNotVisible: { id: "daily.sabaq.portion.1.unit.HALF" }
- assertNotVisible: { id: "daily.sabaq.portion.1.unit.SALASAH" }
- assertNotVisible: { id: "daily.sabaq.portion.1.unit.COMPLETE" }
# 3. Sabqi · Add portion and Manzil · Add portion: Rubu, Half, Salasah, and Complete are offered.               (F05-AC20)
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabqi.add" }, direction: DOWN, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.sabqi.add" }, direction: UP, timeout: 60000, centerElement: true }
- waitForAnimationToEnd
- tapOn: { id: "daily.sabqi.add" }
- waitForAnimationToEnd
# A tap that only stopped the scroll is retried once, and only when the new card did not appear.
- runFlow:
    when: { notVisible: { id: "daily.sabqi.portion.1.title" } }
    commands:
      - tapOn: { id: "daily.sabqi.add" }
      - waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabqi.portion.1.unit.PAGES" }, direction: DOWN, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.sabqi.portion.1.unit.PAGES" }, direction: UP, timeout: 60000, centerElement: true }
- assertVisible: { id: "daily.sabqi.portion.1.unit.RUBU" }
- assertVisible: { id: "daily.sabqi.portion.1.unit.HALF" }
- assertVisible: { id: "daily.sabqi.portion.1.unit.SALASAH" }
- assertVisible: { id: "daily.sabqi.portion.1.unit.COMPLETE" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabqi.portion.1.remove" }, direction: DOWN, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.sabqi.portion.1.remove" }, direction: UP, timeout: 60000, centerElement: true }
- waitForAnimationToEnd
- tapOn: { id: "daily.sabqi.portion.1.remove" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.manzil.add" }, direction: DOWN, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.manzil.add" }, direction: UP, timeout: 60000, centerElement: true }
- waitForAnimationToEnd
- tapOn: { id: "daily.manzil.add" }
- waitForAnimationToEnd
# A tap that only stopped the scroll is retried once, and only when the new card did not appear.
- runFlow:
    when: { notVisible: { id: "daily.manzil.portion.1.title" } }
    commands:
      - tapOn: { id: "daily.manzil.add" }
      - waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.manzil.portion.1.unit.PAGES" }, direction: DOWN, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.manzil.portion.1.unit.PAGES" }, direction: UP, timeout: 60000, centerElement: true }
- assertVisible: { id: "daily.manzil.portion.1.unit.RUBU" }
- assertVisible: { id: "daily.manzil.portion.1.unit.HALF" }
- assertVisible: { id: "daily.manzil.portion.1.unit.SALASAH" }
- assertVisible: { id: "daily.manzil.portion.1.unit.COMPLETE" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.manzil.portion.1.remove" }, direction: DOWN, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.manzil.portion.1.remove" }, direction: UP, timeout: 60000, centerElement: true }
- waitForAnimationToEnd
- tapOn: { id: "daily.manzil.portion.1.remove" }
# 4. Sabaq: Surah 2, Ayat 1 to 10 → Para shown read-only; Total Lines pre-filled "From Mushaf layout"; then a
#    hand-entered Total Lines of 10 replaces the layout hint.                                                  (F05-AC21)
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.surah" }, direction: UP, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.surah" }, direction: DOWN, timeout: 60000, centerElement: true }
- waitForAnimationToEnd
- tapOn: { id: "daily.sabaq.portion.1.surah" }
- inputText: "2"
- tapOn: { id: "daily.sabaq.portion.1.ayahStart" }
- inputText: "1"
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.ayahEnd" }, direction: DOWN, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.ayahEnd" }, direction: UP, timeout: 60000, centerElement: true }
- waitForAnimationToEnd
- tapOn: { id: "daily.sabaq.portion.1.ayahEnd" }
- inputText: "10"
- pressKey: Enter
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.linesSource.LAYOUT" }, direction: DOWN, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.linesSource.LAYOUT" }, direction: UP, timeout: 60000, centerElement: true }
- assertVisible: { id: "daily.sabaq.portion.1.para" }
- tapOn: { id: "daily.sabaq.portion.1.totalLines" }
- eraseText: 6
- inputText: "10"
- pressKey: Enter
- assertNotVisible: { id: "daily.sabaq.portion.1.linesSource.LAYOUT" }
- assertVisible: { id: "daily.sabaq.portion.1.linesSource.MANUAL" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.assigned" }, direction: DOWN, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.assigned" }, direction: UP, timeout: 60000, centerElement: true }
- assertVisible: { id: "daily.sabaq.portion.1.assigned", text: "10" }
# 5. Ayat 10 to 1 → the ending Ayat must not be before the starting Ayat.                                       (F05-AC21)
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.ayahStart" }, direction: UP, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.ayahStart" }, direction: DOWN, timeout: 60000, centerElement: true }
- waitForAnimationToEnd
- tapOn: { id: "daily.sabaq.portion.1.ayahStart" }
- eraseText: 4
- inputText: "10"
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.ayahEnd" }, direction: DOWN, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.ayahEnd" }, direction: UP, timeout: 60000, centerElement: true }
- waitForAnimationToEnd
- tapOn: { id: "daily.sabaq.portion.1.ayahEnd" }
- eraseText: 4
- inputText: "1"
- pressKey: Enter
- waitForAnimationToEnd
- runFlow: ../../support/maestro/dismiss-dev-warning.yaml
- scrollUntilVisible: { element: { id: "daily.save" }, direction: DOWN, timeout: 60000, visibilityPercentage: 50, optional: true }
- scrollUntilVisible: { element: { id: "daily.save" }, direction: UP, timeout: 60000, visibilityPercentage: 50 }
- tapOn: { id: "daily.save" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { text: ".*Sabaq.*Portion.*1.*: ending Ayat must not be before the starting Ayat.*" }, direction: DOWN, timeout: 60000, centerElement: true }
# 6. Surah 1 Ayah 5 to Surah 2 Ayah 3 → the range must stay within one Surah.                                    (F05-AC21)
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.surah" }, direction: UP, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.surah" }, direction: DOWN, timeout: 60000, centerElement: true }
- waitForAnimationToEnd
- tapOn: { id: "daily.sabaq.portion.1.surah" }
- eraseText: 3
- inputText: "1"
- tapOn: { id: "daily.sabaq.portion.1.ayahStart" }
- eraseText: 4
- inputText: "5"
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.surahEnd" }, direction: DOWN, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.surahEnd" }, direction: UP, timeout: 60000, centerElement: true }
- waitForAnimationToEnd
- tapOn: { id: "daily.sabaq.portion.1.surahEnd" }
- inputText: "2"
- tapOn: { id: "daily.sabaq.portion.1.ayahEnd" }
- eraseText: 4
- inputText: "3"
- pressKey: Enter
- waitForAnimationToEnd
- runFlow: ../../support/maestro/dismiss-dev-warning.yaml
- scrollUntilVisible: { element: { id: "daily.save" }, direction: DOWN, timeout: 60000, visibilityPercentage: 50, optional: true }
- scrollUntilVisible: { element: { id: "daily.save" }, direction: UP, timeout: 60000, visibilityPercentage: 50 }
- tapOn: { id: "daily.save" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { text: ".*Sabaq.*Portion.*1.*: the range must stay within one Surah.*" }, direction: DOWN, timeout: 60000, centerElement: true }
# 7. Back to Surah 2, Ayat 1–10, Total 10, Assigned 10; Completed 7 → Remaining 3 lines.                        (F05-AC22)
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.surah" }, direction: UP, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.surah" }, direction: DOWN, timeout: 60000, centerElement: true }
- waitForAnimationToEnd
- tapOn: { id: "daily.sabaq.portion.1.surah" }
- eraseText: 3
- inputText: "2"
- tapOn: { id: "daily.sabaq.portion.1.ayahStart" }
- eraseText: 4
- inputText: "1"
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.surahEnd" }, direction: DOWN, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.surahEnd" }, direction: UP, timeout: 60000, centerElement: true }
- waitForAnimationToEnd
- tapOn: { id: "daily.sabaq.portion.1.surahEnd" }
- eraseText: 3
- tapOn: { id: "daily.sabaq.portion.1.ayahEnd" }
- eraseText: 4
- inputText: "10"
- pressKey: Enter
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.totalLines" }, direction: DOWN, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.totalLines" }, direction: UP, timeout: 60000, centerElement: true }
- waitForAnimationToEnd
- tapOn: { id: "daily.sabaq.portion.1.totalLines" }
- eraseText: 6
- inputText: "10"
- tapOn: { id: "daily.sabaq.portion.1.assigned" }
- eraseText: 6
- inputText: "10"
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.completed" }, direction: DOWN, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.completed" }, direction: UP, timeout: 60000, centerElement: true }
- waitForAnimationToEnd
- tapOn: { id: "daily.sabaq.portion.1.completed" }
- inputText: "7"
- pressKey: Enter
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.remaining" }, direction: DOWN, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.remaining" }, direction: UP, timeout: 60000, centerElement: true }
- assertVisible: { id: "daily.sabaq.portion.1.remaining", text: ".*3.*" }
# 8. Completed 11 → more than assigned; Assigned 12 → more than total.                                          (F05-AC22)
- tapOn: { id: "daily.sabaq.portion.1.completed" }
- eraseText: 6
- inputText: "11"
- pressKey: Enter
- waitForAnimationToEnd
- runFlow: ../../support/maestro/dismiss-dev-warning.yaml
- scrollUntilVisible: { element: { id: "daily.save" }, direction: DOWN, timeout: 60000, visibilityPercentage: 50, optional: true }
- scrollUntilVisible: { element: { id: "daily.save" }, direction: UP, timeout: 60000, visibilityPercentage: 50 }
- tapOn: { id: "daily.save" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { text: ".*Sabaq.*Portion.*1.*: completed lines cannot be more than assigned lines.*" }, direction: DOWN, timeout: 60000, centerElement: true }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.assigned" }, direction: UP, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.assigned" }, direction: DOWN, timeout: 60000, centerElement: true }
- waitForAnimationToEnd
- tapOn: { id: "daily.sabaq.portion.1.assigned" }
- eraseText: 6
- inputText: "12"
- pressKey: Enter
- waitForAnimationToEnd
- runFlow: ../../support/maestro/dismiss-dev-warning.yaml
- scrollUntilVisible: { element: { id: "daily.save" }, direction: DOWN, timeout: 60000, visibilityPercentage: 50, optional: true }
- scrollUntilVisible: { element: { id: "daily.save" }, direction: UP, timeout: 60000, visibilityPercentage: 50 }
- tapOn: { id: "daily.save" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { text: ".*Sabaq.*Portion.*1.*: assigned lines cannot be more than total lines.*" }, direction: DOWN, timeout: 60000, centerElement: true }
# 9. Assigned 10, Completed cleared, Not Remembered → saved record shows 0 completed and 10 remaining lines.     (F05-AC22)
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.assigned" }, direction: UP, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.assigned" }, direction: DOWN, timeout: 60000, centerElement: true }
- waitForAnimationToEnd
- tapOn: { id: "daily.sabaq.portion.1.assigned" }
- eraseText: 6
- inputText: "10"
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.completed" }, direction: DOWN, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.completed" }, direction: UP, timeout: 60000, centerElement: true }
- waitForAnimationToEnd
- tapOn: { id: "daily.sabaq.portion.1.completed" }
- eraseText: 6
- pressKey: Enter
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.status.NOT_REMEMBERED" }, direction: DOWN, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.status.NOT_REMEMBERED" }, direction: UP, timeout: 60000, centerElement: true }
- waitForAnimationToEnd
- tapOn: { id: "daily.sabaq.portion.1.status.NOT_REMEMBERED" }
- assertVisible: { id: "daily.sabaq.portion.1.notRememberedDefault" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.mistakes.none" }, direction: DOWN, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "daily.sabaq.portion.1.mistakes.none" }, direction: UP, timeout: 60000, centerElement: true }
- waitForAnimationToEnd
- tapOn: { id: "daily.sabaq.portion.1.mistakes.none" }
- waitForAnimationToEnd
- runFlow: ../../support/maestro/dismiss-dev-warning.yaml
- scrollUntilVisible: { element: { id: "daily.save" }, direction: DOWN, timeout: 60000, visibilityPercentage: 50, optional: true }
- scrollUntilVisible: { element: { id: "daily.save" }, direction: UP, timeout: 60000, visibilityPercentage: 50 }
- tapOn: { id: "daily.save" }
- extendedWaitUntil:
    visible: { id: "record.screen" }
    timeout: 30000
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "record.sabaq.portion.1.remaining" }, direction: DOWN, timeout: 60000, optional: true }
- scrollUntilVisible: { element: { id: "record.sabaq.portion.1.remaining" }, direction: UP, timeout: 60000, centerElement: true }
- assertVisible: { id: "record.sabaq.portion.1.status.NOT_REMEMBERED" }
- assertVisible: { id: "record.sabaq.portion.1.completed", text: ".*0.*" }
- assertVisible: { id: "record.sabaq.portion.1.remaining", text: ".*10.*" }
