# F05 · Daily Hifz entry — mobile E2E (docs/specs/09-f05-daily-hifz-entry.md; design.md §13 US-023)
# Covers: F05-AC15, F05-AC2
# The weekly-report step of F05-AC16 waits for F09: see attempts-weekly-report.yaml (pending). The API E2E checks
# F05-AC16 on the record's derived progress.
# SYNTHETIC DATA ONLY: seeded personas and the synthetic Quran fixture.
appId: com.hifzamanah.app # Android application ID (SRS §17 DEC-B55, decided 2026-11-08)
name: F05 attempts — second attempt keeps the first; history; late sync keeps the date
tags:
  - F05
  - US-018
  - US-023
---
- runFlow: ../../support/maestro/reset.yaml
- runScript:
    file: ../../support/maestro/control.js
    env:
      ACTION: quranSeed
# 1. teacher-a1 records S1 today: Sabqi Para 4, Partial 1/2.
- runFlow:
    file: ../../support/maestro/sign-in.yaml
    env: { USER_ID: teacher-a1 }
- tapOn: { id: "nav.dailyEntry" }
- extendedWaitUntil:
    visible: { id: "daily.class.Hifz A1" }
    timeout: 30000
- copyTextFrom: { id: "daily.date" }
- evalScript: ${output.today = maestro.copiedText.replace(/[^0-9-]/g, '')}
- tapOn: { id: "daily.class.Hifz A1" }
- tapOn: { id: "daily.student.EXT-A-001" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "daily.attendance.PRESENT" }, direction: DOWN, speed: 10 }
- tapOn: { id: "daily.attendance.PRESENT" }
- runFlow:
    file: ../../support/maestro/daily-revision-portion.yaml
    env: { SECTION: sabqi, N: "1", PARA: "4", UNIT: COMPLETE, STATUS: PARTIAL, COMPLETED: HALF }
- waitForAnimationToEnd
- runFlow: ../../support/maestro/dismiss-dev-warning.yaml
- scrollUntilVisible: { element: { id: "daily.save" }, direction: DOWN, speed: 10, visibilityPercentage: 50 }
- tapOn: { id: "daily.save" }
- extendedWaitUntil:
    visible: { id: "record.screen" }
    timeout: 30000
# 2. Add attempt → Completed, quality 1 · Excellent, no mistakes → save.                                        (F05-AC15)
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "record.sabqi.portion.1.addAttempt" }, direction: DOWN, speed: 10 }
- tapOn: { id: "record.sabqi.portion.1.addAttempt" }
- extendedWaitUntil:
    visible: { id: "attempt.title" }
    timeout: 15000
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "attempt.status.COMPLETED" }, direction: DOWN, speed: 10 }
- tapOn: { id: "attempt.status.COMPLETED" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "attempt.mistakes.none" }, direction: DOWN, speed: 10 }
- tapOn: { id: "attempt.mistakes.none" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "attempt.quality.1" }, direction: DOWN, speed: 10 }
- tapOn: { id: "attempt.quality.1" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "attempt.save" }, direction: DOWN, speed: 10 }
- tapOn: { id: "attempt.save" }
- extendedWaitUntil:
    visible: { id: "record.screen" }
    timeout: 30000
# 3. History: two attempts, each with its own time, recorder, quantity, status, mistakes, and quality;
#    the latest is labelled current, and the first is unchanged.                                                (F05-AC15)
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "record.sabqi.portion.1.status.COMPLETED" }, direction: DOWN, speed: 10 }
- assertVisible: { id: "record.sabqi.portion.1.attemptCount", text: ".*2.*" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "record.sabqi.portion.1.history" }, direction: DOWN, speed: 10 }
- tapOn: { id: "record.sabqi.portion.1.history" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "record.sabqi.portion.1.attempt.1.quality" }, direction: DOWN, speed: 10 }
- assertVisible: { id: "record.sabqi.portion.1.attempt.1.status.PARTIAL" }
- assertVisible: { id: "record.sabqi.portion.1.attempt.1.time" }
- assertVisible: { id: "record.sabqi.portion.1.attempt.1.recorder" }
- assertVisible: { id: "record.sabqi.portion.1.attempt.1.completed", text: ".*1/2.*" }
- assertNotVisible: { id: "record.sabqi.portion.1.attempt.1.current" }
- waitForAnimationToEnd
- scrollUntilVisible: { element: { id: "record.sabqi.portion.1.attempt.2.quality" }, direction: DOWN, speed: 10 }
- assertVisible: { id: "record.sabqi.portion.1.attempt.2.status.COMPLETED" }
- assertVisible: { id: "record.sabqi.portion.1.attempt.2.current" }
- assertVisible: { id: "record.sabqi.portion.1.attempt.2.time" }
- assertVisible: { id: "record.sabqi.portion.1.attempt.2.recorder" }
- assertVisible: { id: "record.sabqi.portion.1.attempt.2.quality", text: ".*1.*" }
# 4. Offline: record S2 today; the server's clock moves on a day; back online, it syncs.                        (F05-AC2)
- runFlow: ../../support/maestro/back-home.yaml
- runFlow: ../../support/maestro/go-offline.yaml
- runFlow:
    file: ../../support/maestro/daily-sabqi.yaml
    env: { STUDENT: EXT-A-002 }
- assertNotVisible: { id: "record.sync.SYNCED" }
- runScript:
    file: ../../support/maestro/control.js
    env:
      ACTION: clock
      ADVANCE_MS: "86400000"
- runFlow: ../../support/maestro/go-online.yaml
- extendedWaitUntil:
    visible: { id: "record.sync.SYNCED" }
    timeout: 90000
# 5. The S2 record keeps the date it was recorded for, not the sync date.                                       (F05-AC2)
- assertVisible: { id: "record.date", text: ".*${output.today}.*" }
