# 1. Sign in as admin.a → More → Import → Students → explains the template version.
# 2. Pick students-1001.xlsx → "Maximum 1,000 rows per file — split into several files".               (F14-AC2)
# 3. Pick students-missing-name.xlsx → names the expected version and the missing column.              (F14-AC3)
# 4. Pick students-mixed.xlsx (Urdu UI) → counts per row class; errors on their row and field in Urdu;
#    the name-only row is a suspected duplicate.                                                       (F14-AC11, F14-AC12, F14-AC5)
# 5. Pick students-50.xlsx → 50 new → Confirm → results: 50 created.                                   (F14-AC1)
# 6. Pick students-50.xlsx again → 50 exact matches, 0 new.                                            (F14-AC4)
