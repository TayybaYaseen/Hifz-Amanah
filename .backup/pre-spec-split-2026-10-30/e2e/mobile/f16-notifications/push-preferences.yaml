# 1. Sign in as parent.p1; allow notifications → token registered (API check).                        (F16-AC1)
# 2. Settings → Notifications: only Android push options; no email, SMS, or WhatsApp.                  (F16-AC9)
# 3. Turn "report published" off; publish S1's report → no push.                                       (F16-AC8)
# 4. Turn it on; publish again → one push with generic text.                                           (F16-AC2)
# 5. Tap the push → the app opens S1's report after authentication.                                    (F16-AC4)
# 6. Sign out; publish again → no push to this device.                                                 (F16-AC7)
